[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "pyodoo-rpc-client"
version = "18.0.3"
description = "Odoo legacy RPC API client (XML-RPC/JSON-RPC) for Odoo v19 and below; for JSON 2 API (v19+), use pyodoo-client"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Tumbi-J" }
]
keywords = ["odoo", "rpc", "xmlrpc", "api", "client"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/tumbi-j/pyodoo-rpc-client"
Documentation = "https://github.com/tumbi-j/pyodoo-rpc-client"
Source = "https://github.com/tumbi-j/pyodoo-rpc-client"
Issues = "https://github.com/tumbi-j/pyodoo-rpc-client/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pyodoo_rpc_client"]
